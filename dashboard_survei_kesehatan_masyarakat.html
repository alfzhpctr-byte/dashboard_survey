const P=$('#prov').value,Y=$('#yr').value,ii=+$('#ind').value,ctx=P+' | '+Y;
const fp=r=>P===ALL_P||r.prov===P,fy=r=>Y===ALL_Y||String(r.yr)===Y,rows=R.filter(r=>fp(r)&&fy(r)),N=rows.length;
let k=`<div class="p"><div class="l">JUMLAH RESPONDEN</div><div class="v">${nf(N)}</div><div class="s">${esc(ctx)}</div><div class="s ${N<MIN_N?'w2':''}">${N<MIN_N?'Perhatian: N kecil':'semua usia'}</div></div>`;
IND.forEach(i=>{const e=ev(rows,i),sm=e.d<MIN_N?`<span class="w2">Perhatian: n &lt; ${MIN_N}</span>`:(i.m?`usia ≥ ${i.m} th`:'semua usia');
k+=`<div class="p"><div class="l">${esc(i.k.toUpperCase())}</div><div class="v">${e.d?pc(e.p):'n/a'}</div><div class="s">n = ${nf(e.n)} dari ${nf(e.d)}</div><div class="s">${sm}</div></div>`});
$('#kpi').innerHTML=k;
$('#s1').textContent=`n = ${nf(N)} responden`;
$('#ch1').innerHTML=donut(['Laki-laki','Perempuan'].map(l=>({l,v:cnt(rows,r=>r.sex===l)})),COL);
$('#s2').textContent=`Jumlah responden per kelompok usia (n = ${nf(N)})`;
$('#ch2').innerHTML=vbars(AGES.map(l=>({l,v:cnt(rows,r=>r.ag===l)})),nf);
const dn=rows.filter(r=>r.age>=10);$('#s3').textContent=`Responden usia ≥ 10 th (n = ${nf(dn.length)})`;
$('#ch3').innerHTML=donut(SMK.map(l=>({l,v:cnt(dn,r=>r.smk===l)})),COL);
$('#s4').textContent=ctx;
$('#ch4').innerHTML=hbars(IND.slice(1).map(i=>{const e=ev(rows,i);return{l:i.k,v:e.p,tip:`${i.k}: ${e.n} dari ${e.d}`}}));
const byY=D.years.map(y=>R.filter(r=>fp(r)&&r.yr===y)),ser=(ix,cols)=>ix.map((n,j)=>{const ev2=byY.map(rs=>ev(rs,IND[n]));return{n:IND[n].k,c:cols[j],v:ev2.map(e=>e.d?e.p:null),t:ev2.map(e=>e.d)}});
$('#s5').textContent=$('#s6').textContent='Per tahun | Provinsi: '+P;
$('#ch5').innerHTML=lines(ser([0,1,2,3],['#3F4672','#949CDA','#777EAC','#BEC3EB']),D.years);
$('#ch6').innerHTML=lines(ser([4,5,6],['#3F4672','#949CDA','#777EAC']),D.years);
const ind=IND[ii],pr=D.provs.map(p=>({pv:p,...ev(R.filter(r=>r.prov===p&&fy(r)),ind)}));
$('#s7').textContent=`${ind.k} | ${Y===ALL_Y?'semua tahun':'tahun '+Y} | batang gelap = provinsi terpilih`;
$('#ch7').innerHTML=vbars(pr.map(o=>({l:`${o.pv} (n=${o.d})`,v:o.d?o.p:0,c:o.pv===P?'#3F4672':'#949CDA',tip:`${o.pv}: ${o.n} dari ${o.d}`})),pc,1);
const ok=pr.filter(o=>o.d),hi=ok.reduce((a,b)=>b.p>a.p?b:a,ok[0]),lo=ok.reduce((a,b)=>b.p<a.p?b:a,ok[0]),sn=ok.reduce((a,b)=>a+b.n,0),sd=ok.reduce((a,b)=>a+b.d,0);
const bx=(t,o)=>`<div class="hl"><b>${t}</b><div class="n">${o?esc(o.pv):'n/a'}</div><div class="v">${o?pc(o.p):''}</div><div class="s">${o?'n = '+o.d+' responden'+(o.d<MIN_N?' · n kecil':''):''}</div></div>`;
$('#hl').innerHTML=bx('TERTINGGI',hi)+bx('TERENDAH',lo)+`<div class="hl"><b>Gabungan seluruh provinsi</b><div class="v">${sd?pc(sn/sd):'n/a'}</div></div>`}
init();
</script></body></html>
